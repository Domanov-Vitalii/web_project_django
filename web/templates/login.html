{% extends "base.html" %}
{% block title %}Логін{% endblock %}
{% block content %}
<h2>Вхід</h2>
{% if form.errors %}
  <p style="color:#ff5b5b;">Невірні дані.</p>
{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Увійти</button>
</form>
<p>Немає акаунту? <a href="{% url 'signup' %}">Реєстрація</a></p>
{% endblock %}

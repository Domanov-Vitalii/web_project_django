{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<h2>Створити акаунт</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}

</form>
<p>Вже маєш акаунт? <a href="{% url 'login' %}">Увійти</a></p>
{% endblock %}

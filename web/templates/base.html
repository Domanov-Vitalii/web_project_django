<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Обчислення{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
      html, body { height: 100%; margin:0; padding:0; }
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #acf7fa;
        color: rgb(0, 0, 0);
        font-family: Arial, sans-serif;
    }
    header, footer { padding:10px 20px; background:#c3fad5; }
    .container {
        max-width:900px;
        width:100%;
        margin: 30px auto 0 auto; /* тільки зверху! */
        padding:20px;
        background:#e8c9ec;
        border-radius:8px;
        box-shadow:0 0 10px rgba(0,0,0,.5);
        flex: 0 0 auto; /* не розтягується */
    }
    footer {margin-top: auto;}
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#acf7fa; color:rgb(0, 0, 0); }
    header, footer { padding:10px 20px; background:#c3fad5; }
    a { color:#4db3ff; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .container { max-width:900px; margin:30px auto; padding:20px; background:#e8c9ec; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,.5); }
    input, button { padding:10px; border-radius:6px; border:1px solid #444; background:#266d37; color:#eef; }
    button { cursor:pointer; }
    button:hover { background:#2f3c4f; }
    table { width:100%; border-collapse:collapse; margin-top:15px; }
    th, td { padding:8px 10px; border-bottom:1px solid #333; font-size:14px; }
    .status-PENDING { color:#b5b5ff; }
    .status-RUNNING { color:#4db3ff; }
    .status-SUCCESS { color:#4dff7a; }
    .status-FAILURE, .status-REJECTED { color:#ff5b5b; }
    .status-CANCELED { color:#ffb347; }
    .flex { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
    .center-box { text-align:center; padding:60px 30px; font-size:36px; line-height:1.3; }
    .nav-right { float:right; }
    .badge { background:#2d3b52; padding:3px 6px; border-radius:4px; font-size:12px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<header>
    <strong>Heavy Calc</strong>
  <span class="nav-right">
    {% if user.is_authenticated %}
      Вітаю, {{ user.username }} |
      <a href="{% url 'home' %}">Головна</a> |
      <a href="{% url 'my_tasks' %}">Мої задачі</a> |
      <a href="{% url 'logout' %}">Вийти</a>
    {% else %}
      <a href="{% url 'login' %}">Логін</a> |
      <a href="{% url 'signup' %}">Реєстрація</a>
    {% endif %}
  </span>
</header>
<div class="container">
  {% block content %}{% endblock %}
</div>
<footer>
  <small>© 2025 Heavy Calc Demo</small>
</footer>
</body>
</html>

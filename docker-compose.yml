version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: web_postgres
    environment:
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: my_heavy_calc_db
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_heavy_calc_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: web_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_django
    working_dir: /app
    volumes:
      - ./web:/app
      - static_volume:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: web.settings
      DEBUG: "1"
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: my_heavy_calc_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 1111
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: >
      bash -c "python manage.py makemigrations &&
               python manage.py migrate &&
               python manage.py collectstatic --noinput &&
               gunicorn web.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29.3-alpine
    container_name: web_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

  celery_worker_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker_1
    working_dir: /app
    volumes:
      - ./web:/app
    environment:
      DJANGO_SETTINGS_MODULE: web.settings
      DEBUG: "1"
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: my_heavy_calc_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 1111
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: celery -A web.celery worker --loglevel=info --concurrency=2 --hostname=worker1@%h -Q root_calc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  celery_worker_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker_2
    working_dir: /app
    volumes:
      - ./web:/app
    environment:
      DJANGO_SETTINGS_MODULE: web.settings
      DEBUG: "1"
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: my_heavy_calc_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: 1111
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: celery -A web.celery worker --loglevel=info --concurrency=2 --hostname=worker2@%h -Q root_calc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
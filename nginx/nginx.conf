events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логування
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream для балансування навантаження
    # (Поки один Django інстанс, але структура готова для масштабування)
    upstream django_backend {
        # Least connections algorithm - найменше активних з'єднань
        least_conn;
        
        server web:8000 max_fails=3 fail_timeout=30s;
        
        # Можна додати ще інстанси Django для балансування:
        # server web2:8000 max_fails=3 fail_timeout=30s;
        # server web3:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        # Максимальний розмір тіла запиту
        client_max_body_size 10M;

        # Таймаути для довгих запитів
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;

        # Статичні файли (CSS, JS, зображення)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Proxy всіх запитів до Django
        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (якщо буде потрібно)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check endpoint
        location /health/ {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}